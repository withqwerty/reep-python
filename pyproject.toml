[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reep"
version = "0.0.1"
description = "Python SDK and CLI for the Reep football entity register (in development)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Withqwerty Ltd" }]
keywords = ["football", "soccer", "entity-resolution", "crosswalk", "reep"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://reep.football"
API = "https://reep.football/api"
Downloads = "https://reep.football/downloads"

[project.scripts]
reep = "reep.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reep"]

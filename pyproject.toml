[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reep"
version = "0.3.0"
description = "Python SDK and CLI for the Reep football entity register: exact provider ID lookups, offline or through the API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Withqwerty Ltd", email = "getintouch@withqwerty.com" }]
keywords = ["football", "soccer", "entity-resolution", "crosswalk", "sports-data", "reep"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.2",
    "duckdb>=1.4",
    "httpx>=0.27",
    "platformdirs>=4.3",
]

[project.urls]
Homepage = "https://reep.football"
Documentation = "https://reep.football/docs/python/"
Source = "https://github.com/withqwerty/reep-python"
Issues = "https://github.com/withqwerty/reep-python/issues"
Changelog = "https://github.com/withqwerty/reep-python/blob/main/CHANGELOG.md"

[project.scripts]
reep = "reep.cli:main"

[project.optional-dependencies]
pandas = [
    "pandas>=2.2",
]
polars = [
    "polars>=1.0",
    "pyarrow>=17",
]
arrow = [
    "pyarrow>=17",
]
keyring = [
    "keyring>=25",
]
db = [
    "pyyaml>=6.0",
    "sqlalchemy>=2.1",
]
postgres = [
    "psycopg[binary]>=3.2",
    "reep[db]",
]
mysql = [
    "pymysql>=1.1",
    "reep[db]",
]
mssql = [
    "pymssql>=2.3",
    "reep[db]",
]
mcp = [
    "mcp>=2.1",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    "pre-commit>=4.3",
]
docs = [
    "furo>=2025.9.25",
    "mcp>=2.1",
    "myst-parser>=4.0",
    "sphinx>=8.2",
    "sphinx-click>=6.0",
    "sphinx-notfound-page>=1.0",
    "sphinx-sitemap>=2.6",
    "sphinxext-opengraph>=0.9",
]
lint = ["ruff>=0.17"]
test = [
    "hypothesis>=6.100",
    "jsonschema>=4.23",
    "mcp>=2.1",
    "pandas>=2.2",
    "polars>=1.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pymssql>=2.3",
    "pymysql>=1.1",
    "pytest>=9",
    "pytest-cov>=7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.1",
]
typecheck = ["mypy>=2", "types-pyyaml>=6.0", { include-group = "test" }]

[tool.uv]
required-version = ">=0.12"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/CHANGELOG.md", "/CITATION.cff", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/reep"]

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.format]
# The plan's API sketch uses aligned annotation comments.
exclude = ["docs/plan.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RET",      # flake8-return
    "PTH",      # flake8-use-pathlib
    "TC",       # flake8-type-checking
    "PT",       # flake8-pytest-style
    "S",        # flake8-bandit
    "T20",      # flake8-print: library code does not print
    "N",        # pep8-naming
    "D",        # pydocstyle
    "RUF",      # ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: no docstrings, plain asserts, SQL built from test constants, and
# annotation-only imports at runtime for readability.
"tests/**" = ["D", "S101", "S608", "TC"]
# SQL in these modules interpolates only validated table names and constant
# fragments; every value is a bound parameter.
"src/reep/_store.py" = ["S608"]
"src/reep/backends/local.py" = ["S608"]
"src/reep/changelog.py" = ["S608"]
# Click uses a backspace character ("\b") in docstrings to keep example lines.
"src/reep/cli/app.py" = ["D301"]

# --- mypy -------------------------------------------------------------------

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# pyarrow ships no type information; the tests use pandas without its stubs.
module = ["pyarrow", "pyarrow.*", "pandas", "pandas.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

# Lets editors that use Pyright or Pylance find the project environment.
[tool.pyright]
venvPath = "."
venv = ".venv"

# --- pytest and coverage ----------------------------------------------------

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not network"]
markers = [
    "network: calls the live Reep release or API (deselected by default; run with -m network)",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["reep"]

[tool.coverage.paths]
source = ["src/reep", "*/site-packages/reep"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
